<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Bakesters — Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f8eee9;
      color: #3b1d32;
    }

    .login-box {
      width: 90%;
      max-width: 420px;
      padding: 40px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(59,29,50,.12);
      box-sizing: border-box;
    }

    h1 {
      margin-top: 0;
      font-family: Georgia, serif;
      font-size: 36px;
    }

    p {
      color: #765d6c;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      margin: 8px 0 14px;
      border: 1px solid #dfcfd7;
      border-radius: 12px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #63294f;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>The Bakesters</h1>
    <p>Admin panel</p>

    <label>Email</label>
    <input id="email" type="email" placeholder="Admin email">

    <label>Password</label>
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <div id="message"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://rlkiprlbdnzanndnnqvb.supabase.co";
    const SUPABASE_KEY = "sb_publishable_k2UDoJ39P64BQl3kEVp0KA_cOR_kRVi";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const message = document.getElementById("message");

      message.textContent = "Logging in...";

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        message.textContent = error.message;
        return;
      }

      window.location.href = "admin-dashboard.html";
    }
  </script>

</body>
</html>
