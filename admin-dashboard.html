<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Bakesters — Admin Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8eee9;
      color: #3b1d32;
    }

    header {
      background: #3b1d32;
      color: white;
      padding: 22px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    header h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: 28px;
    }

    header button {
      background: white;
      color: #3b1d32;
      border: 0;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    main {
      width: 92%;
      max-width: 1200px;
      margin: 30px auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      gap: 15px;
    }

    .topbar h2 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: 32px;
    }

    .add-btn {
      background: #63294f;
      color: white;
      border: 0;
      padding: 13px 20px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    .products {
      display: grid;
      gap: 18px;
    }

    .product {
      background: white;
      border-radius: 18px;
      padding: 18px;
      display: grid;
      grid-template-columns: 110px 1fr auto;
      gap: 20px;
      align-items: center;
      box-shadow: 0 8px 30px rgba(59,29,50,.08);
    }

    .product img {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 14px;
      background: #f2e6e1;
    }

    .product h3 {
      margin: 0 0 7px;
      font-family: Georgia, serif;
      font-size: 22px;
    }

    .product p {
      margin: 5px 0;
      color: #765d6c;
    }

    .price {
      font-weight: bold;
      color: #63294f;
      font-size: 18px;
    }

    .stock {
      font-size: 14px;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .actions button {
      border: 0;
      padding: 10px 13px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
    }

    .edit {
      background: #eee0e8;
      color: #63294f;
    }

    .delete {
      background: #f5dddd;
      color: #9b3030;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(30,15,25,.55);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-box {
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      background: white;
      border-radius: 22px;
      padding: 28px;
    }

    .modal-box h2 {
      margin-top: 0;
      font-family: Georgia, serif;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #dfcfd7;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .form-buttons {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }

    .form-buttons button {
      flex: 1;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .save {
      background: #63294f;
      color: white;
    }

    .cancel {
      background: #eee0e8;
      color: #63294f;
    }

    .image-preview {
      margin-top: 10px;
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 12px;
      display: none;
    }

    #message {
      margin-bottom: 18px;
      font-weight: bold;
    }

    @media (max-width: 700px) {
      .product {
        grid-template-columns: 80px 1fr;
      }

      .product img {
        width: 80px;
        height: 80px;
      }

      .actions {
        grid-column: 1 / -1;
      }

      .actions button {
        flex: 1;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>The Bakesters</h1>
  <button onclick="logout()">Logout</button>
</header>

<main>

  <div class="topbar">
    <h2>Products</h2>
    <button class="add-btn" onclick="openAdd()">+ Add Product</button>
  </div>

  <div id="message"></div>

  <div id="products" class="products">
    Loading products...
  </div>

</main>

<div id="modal" class="modal">
  <div class="modal-box">

    <h2 id="modalTitle">Add Product</h2>

    <input type="hidden" id="productId">

    <label>Product name</label>
    <input id="name" type="text" placeholder="Example: Brownie Box">

    <label>Price (₹)</label>
    <input id="price" type="number" min="0" placeholder="500">

    <label>Description</label>
    <textarea id="description" placeholder="Describe the product"></textarea>

    <label>Category</label>
    <input id="category" type="text" placeholder="Example: brownies">

    <label>Stock</label>
    <input id="stock" type="number" min="0" placeholder="10">

    <label>Weight / Size</label>
    <input id="weight" type="text" placeholder="500g">

    <label>Badge</label>
    <input id="badge" type="text" placeholder="Bestseller">

    <label>Sort order</label>
    <input id="sortOrder" type="number" min="0" placeholder="1">

    <label>
      <input id="active" type="checkbox" checked style="width:auto;">
      Show this product on website
    </label>

    <label>Product image</label>
    <input id="image" type="file" accept="image/*">

    <img id="preview" class="image-preview">

    <div class="form-buttons">
      <button class="cancel" onclick="closeModal()">Cancel</button>
      <button class="save" onclick="saveProduct()">Save Product</button>
    </div>

  </div>
</div>

<script>

  const SUPABASE_URL = "https://rlkiprlbdnzanndnnqvb.supabase.co";

  const SUPABASE_KEY = "sb_publishable_k2UDoJ39P64BQl3kEVp0KA_cOR_kRVi";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  async function checkAdmin() {

    const { data } = await supabaseClient.auth.getSession();

    if (!data.session) {
      window.location.href = "admin.html";
      return false;
    }

    return true;
  }


  async function loadProducts() {

    const { data, error } = await supabaseClient
      .from("product")
      .select("*")
      .order("sort_order", { ascending: true });

    if (error) {
      showMessage(error.message, true);
      return;
    }

    const container = document.getElementById("products");

    if (!data || data.length === 0) {
      container.innerHTML = "<p>No products yet.</p>";
      return;
    }

    container.innerHTML = data.map(product => `

      <div class="product">

        <img
          src="${product.image_url || ''}"
          alt="${escapeHtml(product.name)}"
        >

        <div>

          <h3>${escapeHtml(product.name)}</h3>

          <p class="price">₹${Number(product.price || 0)}</p>

          <p>${escapeHtml(product.description || "")}</p>

          <p class="stock">
            Stock: <strong>${Number(product.stock || 0)}</strong>
            &nbsp; • &nbsp;
            ${product.is_active ? "Visible" : "Hidden"}
          </p>

        </div>

        <div class="actions">

          <button
            class="edit"
            onclick="openEdit(${product.id})">
            Edit
          </button>

          <button
            class="delete"
            onclick="deleteProduct(${product.id})">
            Delete
          </button>

        </div>

      </div>

    `).join("");
  }


  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function openAdd() {

    document.getElementById("modalTitle").textContent = "Add Product";

    document.getElementById("productId").value = "";

    document.getElementById("name").value = "";
    document.getElementById("price").value = "";
    document.getElementById("description").value = "";
    document.getElementById("category").value = "";
    document.getElementById("stock").value = "0";
    document.getElementById("weight").value = "";
    document.getElementById("badge").value = "";
    document.getElementById("sortOrder").value = "0";
    document.getElementById("active").checked = true;

    document.getElementById("image").value = "";

    document.getElementById("preview").style.display = "none";

    document.getElementById("modal").style.display = "flex";
  }


  async function openEdit(id) {

    const { data, error } = await supabaseClient
      .from("product")
      .select("*")
      .eq("id", id)
      .single();

    if (error) {
      showMessage(error.message, true);
      return;
    }

    document.getElementById("modalTitle").textContent = "Edit Product";

    document.getElementById("productId").value = data.id;

    document.getElementById("name").value = data.name || "";
    document.getElementById("price").value = data.price || "";
    document.getElementById("description").value = data.description || "";
    document.getElementById("category").value = data.category || "";
    document.getElementById("stock").value = data.stock || 0;
    document.getElementById("weight").value = data.weight || "";
    document.getElementById("badge").value = data.badge || "";
    document.getElementById("sortOrder").value = data.sort_order || 0;
    document.getElementById("active").checked = data.is_active !== false;

    document.getElementById("image").value = "";

    const preview = document.getElementById("preview");

    if (data.image_url) {
      preview.src = data.image_url;
      preview.style.display = "block";
    } else {
      preview.style.display = "none";
    }

    document.getElementById("modal").style.display = "flex";
  }


  async function saveProduct() {

    const id = document.getElementById("productId").value;

    const name = document.getElementById("name").value.trim();
    const price = Number(document.getElementById("price").value);
    const description = document.getElementById("description").value.trim();
    const category = document.getElementById("category").value.trim();
    const stock = Number(document.getElementById("stock").value);
    const weight = document.getElementById("weight").value.trim();
    const badge = document.getElementById("badge").value.trim();
    const sortOrder = Number(document.getElementById("sortOrder").value);
    const isActive = document.getElementById("active").checked;

    if (!name) {
      alert("Please enter a product name.");
      return;
    }

    if (Number.isNaN(price) || price < 0) {
      alert("Please enter a valid price.");
      return;
    }

    const file = document.getElementById("image").files[0];

    let imageUrl = null;

    if (file) {

      const extension =
        file.name.split(".").pop().toLowerCase();

      const fileName =
        Date.now() + "-" +
        Math.random().toString(36).slice(2) +
        "." + extension;

      const { error: uploadError } =
        await supabaseClient.storage
          .from("product-images")
          .upload(fileName, file, {
            cacheControl: "3600",
            upsert: false
          });

      if (uploadError) {
        alert("Image upload failed: " + uploadError.message);
        return;
      }

      const { data: publicData } =
        supabaseClient.storage
          .from("product-images")
          .getPublicUrl(fileName);

      imageUrl = publicData.publicUrl;
    }


    const productData = {
      name: name,
      price: price,
      description: description,
      category: category,
      stock: stock,
      weight: weight,
      badge: badge,
      sort_order: sortOrder,
      is_active: isActive
    };

    if (imageUrl) {
      productData.image_url = imageUrl;
    }


    let result;

    if (id) {

      result = await supabaseClient
        .from("product")
        .update(productData)
        .eq("id", id)
        .select();

    } else {

      result = await supabaseClient
        .from("product")
        .insert(productData);

    }


   if (result.error) {
  alert("Could not save product: " + result.error.message);
  return;
}

if (id && (!result.data || result.data.length === 0)) {
  alert("No product row was updated. ID used: " + id);
  return;
}

closeModal();

    await loadProducts();

    showMessage("Product saved successfully.");

  }


  async function deleteProduct(id) {

    const confirmed =
      confirm("Are you sure you want to delete this product?");

    if (!confirmed) return;

    const { error } = await supabaseClient
      .from("product")
      .delete()
      .eq("id", id);

    if (error) {
      alert("Could not delete product: " + error.message);
      return;
    }

    await loadProducts();

    showMessage("Product deleted.");

  }


  function closeModal() {
    document.getElementById("modal").style.display = "none";
  }


  async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href = "admin.html";

  }


  function showMessage(text, error = false) {

    const message =
      document.getElementById("message");

    message.textContent = text;

    message.style.color =
      error ? "#9b3030" : "#63294f";

    setTimeout(() => {
      message.textContent = "";
    }, 4000);

  }


  document.getElementById("image")
    .addEventListener("change", function() {

      const file = this.files[0];

      const preview =
        document.getElementById("preview");

      if (!file) {
        preview.style.display = "none";
        return;
      }

      preview.src = URL.createObjectURL(file);

      preview.style.display = "block";

    });


  async function start() {

    const allowed = await checkAdmin();

    if (!allowed) return;

    await loadProducts();

  }

  start();

</script>

</body>
</html>
